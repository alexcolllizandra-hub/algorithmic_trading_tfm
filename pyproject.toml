[project]
name = "perp-lab"
version = "0.1.0"
description = "Reproducible framework for discovering and validating interpretable intraday strategies on BTC/ETH USDT-M perpetual futures (Master's Thesis, Phase 1: data + EDA)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Alex" }]

# Phase 1 runtime dependencies ONLY (data acquisition, quality, EDA).
# No strategy / search / backtesting / ML / API / frontend deps yet.
dependencies = [
    "polars>=1.9",
    "pyarrow>=17",
    "duckdb>=1.1",
    "ccxt>=4.4",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "pandera[polars]>=0.22",
    "numpy>=2.0",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "arch>=7.1",
    "matplotlib>=3.9",
    "plotly>=5.24",
    "rich>=13.9",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "pyright>=1.1.386",
    "jupyterlab>=4.3",
    "ipykernel>=6.29",
    "nbstripout>=0.8",
]

[project.scripts]
perp-lab = "perp_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/perp_lab"]

[tool.uv]
package = true

# --------------------------------------------------------------------------- #
# Tooling configuration
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
markers = [
    "network: tests that require internet access (deselect with '-m \"not network\"')",
]
