# =====================================================================
# RESEARCH search configuration -- runs on VALIDATED development data.
# Requires `perp-lab download` to have produced the processed development
# partition. Parameter spaces, costs, walk-forward geometry, objective
# weights and the budget parity all come from configs/experiment.yaml.
# =====================================================================

experiment_config: configs/experiment.yaml
data_contract: configs/data_contract.yaml

family: momentum
algorithm: comparison
symbol: BTCUSDT
timeframe: "1h"
seed: 42
regime_model: kmeans
require_funding: false
synthetic: false
label: research

# population_size * generations == evaluation budget (fair-budget parity).
ga:
  population_size: 100
  generations: 20
  crossover_rate: 0.7
  mutation_rate: 0.2
  elitism: 5
  tournament_size: 3

# No walk_forward_override: the research folds come from experiment.yaml
# (initial_train_days / validation_days / test_days / step_days) and the
# frozen holdout is excluded automatically.
