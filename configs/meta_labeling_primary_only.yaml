# =========================================================================== #
# TEMPLATE — control arm: the primary strategy, unfiltered.
#
# NOT EXECUTED. This is one half of a pre-registered A/B comparison whose other
# half is `meta_labeling_primary_plus_meta.yaml`. The two files must differ in
# exactly one respect — whether the meta-label filter is applied — so that any
# difference in net return is attributable to the filter and to nothing else.
#
# The comparison may only be run once a primary family has passed its own gate.
# No S1 family did (docs/roadmap/gate_s1b_outcome.md), so there is nothing
# eligible to fill `family` below.
# =========================================================================== #
version: "0.1.0"
arm: "primary_only"

experiment_config: "configs/experiment.yaml"
data_contract: "configs/data_contract.yaml"

# The interpretable rule that produces the DIRECTION. Left unset on purpose: it
# is filled in by whichever family qualifies, and pre-registering a placeholder
# family here would be pre-registering a result.
family: null
symbol: "BTCUSDT"
timeframe: "1h"

# Development partition only. The holdout is not addressable from this file.
partition: "development"

meta_labeling:
  enabled: false

# Both arms share one seed schedule so the paired comparison is on identical
# folds, candidates and trade sequences.
seed: 42
