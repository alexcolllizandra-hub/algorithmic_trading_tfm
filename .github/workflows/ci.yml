# Quality gate on every push and pull request. Mirrors the local gate the
# project already runs by hand: lint, format, the non-network test suite and
# the stale-claims sweep. Notebook determinism and pyright stay local -- the
# first needs the data lake, the second is run before releases.
name: ci

on:
  push:
    branches: ["main", "feat/**", "fix/**", "docs/**", "style/**", "chore/**"]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Stale-claims sweep
        run: uv run python scripts/check_stale_claims.py

      - name: Tests (non-network)
        run: uv run pytest -m "not network" -q
